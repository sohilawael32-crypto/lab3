<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit author</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .lib { max-width: 500px; margin: 30px auto; padding: 0 16px; }
    .lib label { display: block; margin: 12px 0 4px; }
    .lib input { width: 100%; padding: 8px; box-sizing: border-box; }
    .lib .errors { color: #b00020; background: #fdecea; padding: 10px 24px; border-radius: 6px; }
    .lib .buttons { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
    .lib img.current { height: 120px; width: auto; border-radius: 4px; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
<div class="lib">
  <h1>Edit author #{{ author.author_id }}</h1>

  {% if errors %}
  <ul class="errors">
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
  </ul>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ author.name }}" required>

    <label for="country">Country</label>
    <input type="text" id="country" name="country" value="{{ author.country or '' }}">

    <label for="image">Photo</label>
    {% set photo = image_url('authors', author.author_id) %}
    {% if photo %}<img class="current" src="{{ photo }}" alt="Current photo">{% endif %}
    <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/gif,image/webp">
    <small>Leave empty to keep the current photo.</small>

    <div class="buttons">
      <button type="submit">Save</button>
      <a href="/library">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
