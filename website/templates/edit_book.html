<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit book</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .lib { max-width: 500px; margin: 30px auto; padding: 0 16px; }
    .lib label { display: block; margin: 12px 0 4px; }
    .lib input, .lib select { width: 100%; padding: 8px; box-sizing: border-box; }
    .lib .errors { color: #b00020; background: #fdecea; padding: 10px 24px; border-radius: 6px; }
    .lib .buttons { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
    .lib img.current { height: 120px; width: auto; border-radius: 4px; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
<div class="lib">
  <h1>Edit book #{{ book.book_id }}</h1>

  {% if errors %}
  <ul class="errors">
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
  </ul>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ book.title }}" required>

    <label for="price">Price</label>
    <input type="text" id="price" name="price" value="{{ book.price }}" required>

    <label for="author_id">Author</label>
    <select id="author_id" name="author_id" required>
      {% for a in authors %}
      <option value="{{ a.author_id }}" {% if a.author_id == book.author_id %}selected{% endif %}>
        {{ a.author_id }} - {{ a.name }}
      </option>
      {% endfor %}
    </select>

    <label for="image">Cover image</label>
    {% set cover = image_url('books', book.book_id) %}
    {% if cover %}<img class="current" src="{{ cover }}" alt="Current cover">{% endif %}
    <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/gif,image/webp">
    <small>Leave empty to keep the current image.</small>

    <div class="buttons">
      <button type="submit">Save</button>
      <a href="/library">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
